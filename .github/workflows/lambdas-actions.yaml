name: "Lambda (main) - Zip & Update Functions"

# Deploys straight to the staging Lambda functions on every push to `main`
# that touches either Lambda's code. Both loopper-ai-staging-api-to-sqs and
# loopper-ai-staging-pipe-to-app-server are plain Zip-package Lambdas
# (confirmed via `aws lambda get-function`) that take a single root-level
# handler.py — no container image, no dependencies beyond boto3 (already in
# the Lambda Python runtime). This used to build+push a Docker image to ECR
# and update the functions with --image-uri, but neither ECR repo it targeted
# ever existed and neither function is image-packaged — every run failed at
# the ECR push step, before ever reaching an actual function update. Mirrors
# lambdas-dev-deploy.yaml (dev -> dev), just retargeted at main -> staging.

on:
  push:
    branches:
      - main
    paths:
      - 'Lambda-Webhook/handler.py'
      - 'Lambda-SQS/handler.py'
      - 'Lambda-S3-RAG/handler.py'
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  LAMBDA_API_TO_SQS: loopper-ai-staging-api-to-sqs
  LAMBDA_PIPE_TO_APP: loopper-ai-staging-pipe-to-app-server
  LAMBDA_S3_TO_RAG: loopper-ai-staging-s3-to-rag

jobs:
  deploy:
    name: "Zip & Update staging Lambdas"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Zip api-to-sqs (Lambda-Webhook)
        run: |
          cd Lambda-Webhook
          zip -q ../api-to-sqs.zip handler.py

      - name: Zip pipe-to-app-server (Lambda-SQS)
        run: |
          cd Lambda-SQS
          zip -q ../pipe-to-app-server.zip handler.py

      - name: Zip s3-to-rag (Lambda-S3-RAG)
        run: |
          cd Lambda-S3-RAG
          zip -q ../s3-to-rag.zip handler.py

      - name: Update api-to-sqs Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_API_TO_SQS }} \
            --zip-file fileb://api-to-sqs.zip \
            --region ${{ env.AWS_REGION }}

      - name: Wait for api-to-sqs Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_API_TO_SQS }} \
            --region ${{ env.AWS_REGION }}

      - name: Update pipe-to-app-server Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_PIPE_TO_APP }} \
            --zip-file fileb://pipe-to-app-server.zip \
            --region ${{ env.AWS_REGION }}

      - name: Wait for pipe-to-app-server Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_PIPE_TO_APP }} \
            --region ${{ env.AWS_REGION }}

      - name: Update s3-to-rag Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_S3_TO_RAG }} \
            --zip-file fileb://s3-to-rag.zip \
            --region ${{ env.AWS_REGION }}

      - name: Wait for s3-to-rag Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_S3_TO_RAG }} \
            --region ${{ env.AWS_REGION }}

      - name: Summary
        run: |
          echo "### Staging Lambda Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **api-to-sqs**: ${{ env.LAMBDA_API_TO_SQS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **pipe-to-app-server**: ${{ env.LAMBDA_PIPE_TO_APP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **s3-to-rag**: ${{ env.LAMBDA_S3_TO_RAG }}" >> $GITHUB_STEP_SUMMARY
